MOD_JEM_OFFSET_HOURS_DESC="Сдвигает время в будущее (положительные значения) или в прошлое (отрицательные значения). Используется только для отображения неархивированных мероприятий. <br>Примеры: Чтобы показать мероприятия, завершившиеся не менее двух часов назад, установите тип на «Незавершённые мероприятия» и смещение -2. Чтобы показать мероприятия, начинающиеся через неделю или позже, установите тип на «Предстоящие мероприятия» и смещение 168 (7 * 24)."
