PLG_CONTENT_JEMEMBED="JEM — плагин Embed"
PLG_CONTENT_JEMEMBED_XML_DESCRIPTION="Плагин JEM Embed предоставляет JSON API для получения данных о мероприятиях из расширения JEM."
PLG_CONTENT_JEMEMBED_XML_INSTRUCTION="<h3>JEM Embed</h3><p>Плагин выводит мероприятия JEM в формате JSON, который можно использовать различными способами,&nbsp;например,&nbsp;для отображения мероприятий JEM на любых внешних сайтах (см. инструкции ниже).</p><p>Параметры вывода по умолчанию задаются здесь, в настройках плагина. Эти&nbsp;параметры можно дополнить и изменить с помощью параметров в URL вывода.</p><p>Пример:<br /><code class='rl_code'>https://domain.com/index.php?option=com_ajax&amp;plugin=jemembed&amp;group=content&amp;format=json&amp;token=YOUR_SECURITY_TOKEN&amp;max=10&amp;venueids=1,2&amp;category=2,3,5</code></p><p><strong>Параметры</strong><br /><code class='rl_code'>type=today|unfinished|upcoming|archived|newest<br />featured=on|off|only<br />title=on|link|off<br />date=on|link|off<br />time=on|off<br />enddatetime=on|off<br />catids=[идентификаторы категорий через запятую]<br />category=on|link|off<br />venueids=[идентификаторы мест проведения через запятую]<br />venue=on|link|off<br />max=n<br />cuttitle=n<br />noeventsmsg=[текст сообщения]</code></p><p>Если используется более одного параметра, они объединяются логическим И. Это означает, что будут показаны только мероприятия, соответствующие ВСЕМ условиям.</p><p><strong>Токен</strong>: токен безопасности для предотвращения недопустимых запросов, задаётся в настройках плагина.</p><p><strong>Пояснения</strong>:</p><p><code>n</code>: положительное число<br /><code>|</code>: разделяет варианты, из которых можно выбрать один<br /><code>type=today</code>: сегодняшние мероприятия<br /><code>type=unfinished</code>: предстоящие и текущие мероприятия<br /><code>type=upcoming</code>: предстоящие мероприятия, которые ещё не начались<br /><code>type=archived</code>: архивные мероприятия<br /><code>type=newest</code>: новейшие мероприятия (с наибольшими ID)<br /><code>max</code>: максимальное количество отображаемых мероприятий<br /><code>cuttitle</code>: максимальная длина заголовка<br /><code>noeventsmsg</code>: сообщение, отображаемое, если мероприятий нет</p><p><strong>Как встроить мероприятия JEM на внешний сайт:</strong></p><ol><li><strong>Скачайте и распакуйте файлы</strong><br />Скачайте архив <a href='/media/plg_content_jemembed/files/jemevents.zip'>jemevents.zip</a> и распакуйте его. Вы получите следующие четыре файла:<ul><li><code>jemevents.php</code></li><li><code>jemevents.js</code></li><li><code>jemevents-example.html</code> (пример страницы, показывающий, как работает встраивание)</li><li><code>readme.txt</code> (инструкция по использованию файлов)</li></ul></li><li><strong>Загрузите файлы на ваш веб-сервер</strong><br />Загрузите файлы <code>jemevents.php</code> и <code>jemevents.js</code> в веб-пространство внешнего сайта.<br /><em>Примечание: файл <code>jemevents-example.html</code> не обязателен и предназначен только для справки.</em></li><li><strong>Настройте параметры</strong><br />Откройте файл <code>jemevents.php</code> и заполните раздел настроек в соответствии с вашими потребностями.</li><li><strong>Подключите файл JavaScript</strong><br />На странице, где должны отображаться мероприятия, добавьте следующую строку перед закрывающим тегом <code>&lt;/body&gt;</code>:<br /><code>&lt;script src='/jemevents.js'&gt;&lt;/script&gt;</code></li><li><strong>Добавьте контейнер для мероприятий</strong><br />В том месте страницы, где должны появляться мероприятия, добавьте следующий HTML-элемент:<br /><code>&lt;div id='jemevents-container'&gt;&lt;/div&gt;</code></li></ol>"