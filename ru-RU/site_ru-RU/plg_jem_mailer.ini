PLG_JEM_MAILER_USER_REG_SUBJECT=%s: Успешная регистрация на мероприятие
PLG_JEM_MAILER_USER_REG_BODY_9=Здравствуйте, %s, \n\nВы успешно зарегистрировались на следующее мероприятие: \n\nНазвание: %s \nДата: %s \nВремя: %s \nМесто проведения: %s / %s \n\nЗабронировано мест:%s \n\nОписание:\n%s \n\nПрямая ссылка: %s \n\nСпасибо\n%s
