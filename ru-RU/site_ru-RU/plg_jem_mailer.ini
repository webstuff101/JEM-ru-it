; Plugin options

PLG_JEM_MAILER_ALL_ADMINS=Получатели системных писем
PLG_JEM_MAILER_NOTIFICATIONS=Уведомления
PLG_JEM_MAILER_PROFILES_MATRIX=Профили и матрица
PLG_JEM_MAILER_PROFILES_MATRIX_DESC=Настройте существующие параметры уведомлений почтового плагина JEM с помощью профилей и компактной матрицы.
PLG_JEM_MAILER_PROFILES_MATRIX_HELP=Выберите профиль, чтобы применить полный набор уведомлений, или настройте матрицу вручную. Подробные вкладки ниже содержат те же отдельные параметры.
PLG_JEM_MAILER_PROFILE_QUIET=Тихий
PLG_JEM_MAILER_PROFILE_QUIET_DESC=Только подтверждения участникам; минимум рассылок на сайте.
PLG_JEM_MAILER_PROFILE_STANDARD=Стандартный
PLG_JEM_MAILER_PROFILE_STANDARD_DESC=Подтверждения пользователям и администраторам для типовых рабочих процессов.
PLG_JEM_MAILER_PROFILE_COMMUNITY=Сообщество
PLG_JEM_MAILER_PROFILE_COMMUNITY_DESC=Более широкие уведомления для авторов, категорий, групп и участников.
PLG_JEM_MAILER_PROFILE_EDITORIAL=Редакторский
PLG_JEM_MAILER_PROFILE_EDITORIAL_DESC=Сосредоточен на отправке, проверке и координации редакторов.
PLG_JEM_MAILER_SECTION_PROFILES=Профили
PLG_JEM_MAILER_LEGEND_PROFILE=Профиль
PLG_JEM_MAILER_LEGEND_PROFILE_DESC=применяет полный пресет.
PLG_JEM_MAILER_LEGEND_CHECKBOX=Флажок
PLG_JEM_MAILER_LEGEND_CHECKBOX_DESC=включает получателя для данного действия.
PLG_JEM_MAILER_MATRIX_ACTION=Действие
PLG_JEM_MAILER_MATRIX_USER=Действующий пользователь
PLG_JEM_MAILER_MATRIX_REGISTERED=Зарегистрированный
PLG_JEM_MAILER_SECTION_REGISTRATION=Регистрация
PLG_JEM_MAILER_SECTION_EVENTS=Отправка мероприятий
PLG_JEM_MAILER_SECTION_VENUES=Отправка мест проведения
PLG_JEM_MAILER_MATRIX_AFFECTED_ATTENDEE=Затронутый участник
PLG_JEM_MAILER_MATRIX_SUBMITTER_EDITOR=Отправитель / редактор
PLG_JEM_MAILER_MATRIX_EVENT_CREATOR=Автор мероприятия
PLG_JEM_MAILER_MATRIX_VENUE_CREATOR=Автор места проведения
PLG_JEM_MAILER_MATRIX_EVENT_CREATORS_USING_VENUE=Авторы мероприятий, использующих место
PLG_JEM_MAILER_MATRIX_REGISTERED_ATTENDEES=Зарегистрированные участники
PLG_JEM_MAILER_MATRIX_REGISTRATION=Регистрация на мероприятие / статус участия
PLG_JEM_MAILER_MATRIX_WAITINGLIST=Изменение листа ожидания
PLG_JEM_MAILER_MATRIX_UNREGISTRATION=Отмена регистрации
PLG_JEM_MAILER_MATRIX_EVENT_NEW=Новое мероприятие
PLG_JEM_MAILER_MATRIX_EVENT_EDIT=Изменённое мероприятие / изменение статуса
PLG_JEM_MAILER_MATRIX_VENUE_NEW=Новое место проведения
PLG_JEM_MAILER_MATRIX_VENUE_EDIT=Изменённое место / изменение статуса
PLG_JEM_MAILER_MATRIX_NOT_APPLICABLE=Для этого действия данный тип получателя недоступен.
PLG_JEM_MAILER_USER_NOTIFICATIONS=Уведомления о регистрации
PLG_JEM_MAILER_ADMIN_REG_DESC=Решите, должны ли администраторы сайта получать письмо-подтверждение, когда пользователь регистрируется на мероприятие. Адреса электронной почты, на которые должны приходить подтверждения, необходимо указать ниже в поле «Список рассылки».
PLG_JEM_MAILER_SETTINGS_USER_REG_ONOFF_DESC=Решите, должен ли пользователь получать письмо, когда его добавляют в лист ожидания мероприятия или исключают из него.
PLG_JEM_MAILER_SETTINGS_ADMIN_REG_ONOFF_DESC=Решите, должны ли администраторы сайта получать письмо-подтверждение, когда пользователя добавляют в лист ожидания мероприятия или исключают из него. Адреса электронной почты, на которые должны приходить подтверждения, необходимо указать ниже в поле «Список рассылки».
PLG_JEM_MAILER_USER_UNREG_DESC=Решите, должен ли пользователь получать письмо-подтверждение после отмены регистрации на мероприятие.
PLG_JEM_MAILER_ADMIN_UNREG_DESC=Решите, должны ли администраторы сайта получать письмо-подтверждение, когда пользователь отменяет регистрацию на мероприятие. Адреса электронной почты, на которые должны приходить подтверждения, необходимо указать ниже в поле «Список рассылки».
PLG_JEM_MAILER_REGISTRATION=<b>Письмо о регистрации</b>
PLG_JEM_MAILER_WAITINGLIST=<b>Письмо о добавлении/исключении из листа ожидания</b>
PLG_JEM_MAILER_UNREGISTRATION=<b>Письмо об отмене регистрации</b>
PLG_JEM_MAILER_EVENT_NOTIFICATIONS=Уведомления о мероприятиях
PLG_JEM_MAILER_NEW_EVENT_TITLE=<b>Письмо при новом мероприятии</b>
PLG_JEM_MAILER_EDIT_EVENT_TITLE=<b>Письмо при обновлении мероприятия</b>
PLG_JEM_MAILER_USER_NEW_EVENT_DESC=Решите, должен ли пользователь получать письмо-подтверждение о отправленном мероприятии.
PLG_JEM_MAILER_ADMIN_NEW_EVENT=Письмо администраторам при отправке нового мероприятия
PLG_JEM_MAILER_ADMIN_NEW_EVENT_DESC=Письмо администраторам при отправке нового мероприятия
PLG_JEM_MAILER_USER_EDIT_EVENT_DESC=Решите, должен ли пользователь получать письмо-подтверждение о редактировании мероприятия.
PLG_JEM_MAILER_ADMIN_EDIT_EVENT_DESC=Решите, должны ли администраторы получать письмо-подтверждение о редактировании мероприятия.
PLG_JEM_MAILER_REGISTERED_EDIT_EVENT=Зарегистрированные
PLG_JEM_MAILER_REGISTERED_EDIT_EVENT_DESC=Решите, должны ли пользователи, зарегистрированные и находящиеся в листе ожидания мероприятия, получать письмо при редактировании этого мероприятия.
PLG_JEM_MAILER_REGISTERED_EDIT_VENUE=Зарегистрированные
PLG_JEM_MAILER_REGISTERED_EDIT_VENUE_DESC=Решите, должны ли пользователи, зарегистрированные и находящиеся в листе ожидания мероприятия, получать письмо при редактировании места проведения, привязанного к мероприятию.

PLG_JEM_MAILER_CREATOR_LABEL=Автор
PLG_JEM_MAILER_NOTIFY_CREATOR_DESC=Включить отправку писем автору, когда другой пользователь изменяет элемент.
PLG_JEM_MAILER_REGISTRATION_CREATOR_DESC=Включить отправку писем автору при изменении участников.
PLG_JEM_MAILER_VENUE_EV_CREATOR_LABEL=Автор мероприятия
PLG_JEM_MAILER_VENUE_EV_CREATOR_DESC=Включить отправку писем авторам мероприятий при изменении привязанного места проведения.

PLG_JEM_MAILER_CATEGORY_LABEL=Категория
PLG_JEM_MAILER_NOTIFY_CATEGORY_DESC=Включить отправку писем на адреса, указанные в поле «email» категории, при создании или редактировании мероприятий.
PLG_JEM_MAILER_EDIT_VENUE_CATEGORY_DESC=Включить отправку писем на адреса, указанные в поле «email» категории, при редактировании места проведения, привязанного к мероприятию в этой категории.
PLG_JEM_MAILER_REGISTRATION_CATEGORY_DESC=Включить отправку писем на адреса, указанные в поле «email» категории, при изменении участников.

PLG_JEM_MAILER_CATEGORY_ACL_LABEL=ACL категории
PLG_JEM_MAILER_NOTIFY_CATEGORY_ACL_DESC=Включить отправку писем на адреса, указанные в поле «email» ACL категории, при создании или редактировании мероприятий.
PLG_JEM_MAILER_GROUP_LABEL=Группа
PLG_JEM_MAILER_NEW_EVENT_GROUP=Решите, получает ли группа пользователей категории мероприятия письма при создании нового мероприятия в этой категории.
PLG_JEM_MAILER_EDIT_EVENT_GROUP=Решите, получает ли группа пользователей категории мероприятия письма при изменении мероприятия в этой категории.
PLG_JEM_MAILER_EDIT_VENUE_GROUP=Решите, получает ли группа пользователей категории всех мероприятий в месте проведения письма при изменении места.
PLG_JEM_MAILER_REGISTRATION_GROUP_DESC=Решите, получает ли группа пользователей категории мероприятия письма при изменении участников.

PLG_JEM_MAILER_VENUE_NOTIFICATIONS=Уведомления о местах проведения
PLG_JEM_MAILER_NEW_VENUE_TITLE=<b>Письмо при новом месте проведения</b>
PLG_JEM_MAILER_EDIT_VENUE_TITLE=<b>Письмо при обновлении места проведения</b>
PLG_JEM_MAILER_USER_NEW_VENUE_DESC=Решите, должен ли пользователь получать письмо-подтверждение об отправленном месте проведения.
PLG_JEM_MAILER_ADMIN_NEW_VENUE_DESC=Решите, должны ли администраторы получать письмо-подтверждение об отправке нового места проведения.
PLG_JEM_MAILER_USER_EDIT_VENUE_DESC=Решите, должен ли пользователь получать письмо-подтверждение о редактировании места проведения.
PLG_JEM_MAILER_ADMIN_EDIT_VENUE_DESC=Решите, должны ли администраторы получать письмо-подтверждение о редактировании места проведения.

PLG_JEM_MAILER_ADMIN_OPTIONS=Администраторы
PLG_JEM_MAILER_ALL_ADMINS_DESC=Решите, должны ли администраторы, которым разрешено получать системные письма, получать письма-подтверждения для администраторов.
PLG_JEM_MAILER_ADMIN_MAIL_RECEIVERS=Список рассылки
PLG_JEM_MAILER_ADMIN_MAIL_RECEIVERS_DESC=Адреса электронной почты людей, которые должны получать письма-подтверждения для администраторов. Они должны разделяться запятыми. Этот список работает независимо от вышестоящей настройки, но также прекрасно работает вместе с ней.

