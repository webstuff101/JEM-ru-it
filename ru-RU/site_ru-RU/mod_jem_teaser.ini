MOD_JEM_TEASER_OFFSET_HOURS="Временное смещение (в часах)"
MOD_JEM_TEASER_OFFSET_HOURS_DESC="Сдвигает время в будущее (положительные значения) или в прошлое (отрицательные значения). Используется только для отображения неархивированных мероприятий; для сегодняшних мероприятий округляется до полных дней. <br>Примеры: Чтобы показать мероприятия, завершившиеся не менее двух часов назад, установите тип на «Незавершённые мероприятия» и смещение -2. Чтобы показать мероприятия, начинающиеся через неделю или позже, установите тип на «Предстоящие мероприятия» и смещение 168 (7 * 24). Чтобы показать мероприятия завтрашнего дня, установите тип на «Сегодня» и смещение 24."
