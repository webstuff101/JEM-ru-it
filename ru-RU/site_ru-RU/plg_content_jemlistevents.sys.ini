PLG_CONTENT_JEMLISTEVENTS="JEM — плагин List Events"
PLG_CONTENT_JEMLISTEVENTS_XML_DESCRIPTION="Плагин <strong>JEM List Events</strong> позволяет интегрировать мероприятия JEM в ваши статьи Joomla или пользовательские модули. Используйте тег <code>{jemlistevents}</code> с необязательными параметрами для настройки отображения мероприятий."
PLG_CONTENT_JEMLISTEVENTS_XML_INSTRUCTION="<h3>JEM List Events</h3><p>Плагин позволяет интегрировать мероприятия JEM в статьи Joomla. Добавьте тег <code>{jemlistevents}</code> в содержимое статьи с необязательными параметрами.</p>"
