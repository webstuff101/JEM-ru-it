PLG_CONTENT_JEMLISTEVENTS_TYPE_DESCRIPTION="Укажите, какие мероприятия отображать: <strong>today</strong>: мероприятия, проходящие сегодня. <strong>unfinished</strong>: предстоящие и текущие мероприятия. <strong>ongoing</strong>: текущие мероприятия, проходящие прямо сейчас. <strong>upcoming</strong>: будущие мероприятия, которые ещё не начались. <strong>archived</strong>: прошедшие мероприятия. <strong>newest</strong>: недавно добавленные мероприятия (по наибольшим ID). <strong>open</strong>: открытые мероприятия без даты/времени. <strong>all</strong>: все мероприятия (прошедшие, текущие, предстоящие и архивные)."
