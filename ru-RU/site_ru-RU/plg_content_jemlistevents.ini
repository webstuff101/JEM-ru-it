PLG_CONTENT_JEMLISTEVENTS="JEM — плагин List Events"
PLG_CONTENT_JEMLISTEVENTS_XML_DESCRIPTION="<div class='jem-documentation'><p class='jem-intro'>Плагин <strong>JEM List Events</strong> позволяет без проблем интегрировать мероприятия JEM в статьи Joomla или пользовательские модули. Используйте тег <code>{jemlistevents}</code> с необязательными параметрами, чтобы настроить отображение мероприятий.</p><h2 class='jem-section-title'>Как использовать</h2><p class='jem-instruction'>Добавьте следующий тег в содержимое:</p><div class='jem-code'><code>{jemlistevents}</code></div><p class='jem-instruction'>Параметры по умолчанию задаются в настройках плагина.<br>Чтобы настроить вывод тега, можно изменить параметры по умолчанию непосредственно в теге. Вот полный синтаксис:</p><div class='jem-code'><code>{jemlistevents [type=today|unfinished|ongoing|upcoming|archived|newest|open|all]; [featured=on|off|only]; [title=on|link|off]; [date=on|link|off]; [time=on|off]; [enddatetime=on|off]; [eventids=n]; [catids=n]; [category=on|link|off]; [venueids=n]; [venue=on|link|off]; [max=n]; [cuttitle=n]; [noeventsmsg=msg]}</code></div><p class='jem-note'><strong>Примечание:</strong> замените <code>n</code> положительным числом, а символ <code>|</code> используйте для разделения вариантов (выберите один), см. пример ниже.</p><h2 class='jem-section-title'>Подробное описание параметров</h2><div class='jem-parameters'><ul class='jem-parameter-list'><li class='jem-parameter'><strong>type</strong>: определяет, какие мероприятия отображать.<ul class='jem-sub-parameters'><li><code>today</code>: мероприятия, проходящие сегодня.</li><li><code>unfinished</code>: предстоящие и текущие мероприятия.</li><li><code>ongoing</code>: текущие мероприятия, проходящие прямо сейчас.</li><li><code>upcoming</code>: будущие мероприятия, которые ещё не начались.</li><li><code>archived</code>: архивные мероприятия.</li><li><code>newest</code>: недавно добавленные мероприятия (по наибольшим ID).</li><li><code>open</code>: открытые мероприятия без даты/времени</li><li><code>all</code>: все мероприятия (прошедшие, текущие, предстоящие и архивные)</li></ul></li><li class='jem-parameter'><strong>featured</strong>: включать избранные мероприятия.<ul class='jem-sub-parameters'><li><code>on</code>: показывать избранные и обычные мероприятия.</li><li><code>off</code>: показывать только обычные мероприятия (скрыть избранные).</li><li><code>only</code>: показывать только избранные мероприятия.</li></ul></li><li class='jem-parameter'><strong>title</strong>: отображение заголовков мероприятий.<ul class='jem-sub-parameters'><li><code>on</code>: показывать заголовки.</li><li><code>link</code>: показывать заголовки как ссылки.</li><li><code>off</code>: скрыть заголовки.</li></ul></li><li class='jem-parameter'><strong>date</strong>: отображение дат мероприятий.<ul class='jem-sub-parameters'><li><code>on</code>: показывать даты.</li><li><code>link</code>: показывать даты как ссылки.</li><li><code>off</code>: скрыть даты.</li></ul></li><li class='jem-parameter'><strong>time</strong>: отображение времени мероприятий.<ul class='jem-sub-parameters'><li><code>on</code>: показывать время.</li><li><code>off</code>: скрыть время.</li></ul></li><li class='jem-parameter'><strong>enddatetime</strong>: отображение даты/времени окончания мероприятий.<ul class='jem-sub-parameters'><li><code>on</code>: показывать дату/время окончания.</li><li><code>off</code>: скрыть дату/время окончания.</li></ul></li><li class='jem-parameter'><strong>eventids</strong>: фильтрация мероприятий по ID мероприятия (например, <code>eventids=3,10,12</code>).</li><li class='jem-parameter'><strong>catids</strong>: фильтрация мероприятий по ID категории (например, <code>catids=2,14</code>).</li><li class='jem-parameter'><strong>category</strong>: отображение категорий мероприятий.<ul class='jem-sub-parameters'><li><code>on</code>: показывать категории.</li><li><code>link</code>: показывать категории как ссылки.</li><li><code>off</code>: скрыть категории.</li></ul></li><li class='jem-parameter'><strong>venueids</strong>: фильтрация мероприятий по ID места проведения (например, <code>venueids=2,4</code>).</li><li class='jem-parameter'><strong>venue</strong>: отображение мест проведения мероприятий.<ul class='jem-sub-parameters'><li><code>on</code>: показывать места проведения.</li><li><code>link</code>: показывать места проведения как ссылки.</li><li><code>off</code>: скрыть места проведения.</li></ul></li><li class='jem-parameter'><strong>max</strong>: ограничение количества отображаемых мероприятий (например, <code>max=5</code>).</li><li class='jem-parameter'><strong>cuttitle</strong>: ограничение длины заголовков мероприятий (например, <code>cuttitle=25</code>).</li><li class='jem-parameter'><strong>noeventsmsg</strong>: пользовательское сообщение, отображаемое, если мероприятия не найдены (например, <code>noeventsmsg='Мероприятия не найдены'</code>).</li></ul></div><h2 class='jem-section-title'>Пример</h2><p class='jem-instruction'>Чтобы отобразить до 5 предстоящих мероприятий из категорий 2 и 14, используйте:</p><div class='jem-code'><code>{jemlistevents type=upcoming; catids=2,14; max=5; noeventsmsg='Мероприятия не найдены'}</code></div><br><h2 class='jem-section-title'>Форматирование даты и времени</h2><p class='jem-instruction'>Подробнее о форматировании даты и времени см. в <a class='jem-link' href='https://www.php.net/manual/datetime.format.php' target='_blank'>документации PHP DateTime</a>.</p><p class='jem-outro'>Приятного использования плагина JEM List Events для улучшения вашего контента Joomla!</p></div>"
