PKG_JEM="JEM — Пакет"
PKG_JEM_INSTALLATION_DESCRIPTION="<p>JEM — компонент управления мероприятиями для Joomla.</p><p>Это не классический календарь — это удобный способ управления и представления мероприятий для вашей группы, компании или сообщества.<br>JEM предлагает множество функций и возможностей, включая управление местами проведения, повторение мероприятий, регистрацию, ссылки на картографические сервисы, подачу мероприятий и мест проведения из фронтенда и многое другое.</p><p>Этот пакет устанавливает компонент JEM (<code>com_jem</code>) вместе со следующими модулями и плагинами:</p><div class='row'><div class='col-md-6'><h3>Модули</h3><ul><li>Модуль Latest Events Basic (<code>mod_jem</code>)</li><li>Модуль Latest Events Wide (<code>mod_jem_wide</code>)</li><li>Модуль календаря (<code>mod_jem_cal</code>)</li><li>Модуль Venues Map (<code>mod_jem_map</code>)</li><li>Модуль Teaser (<code>mod_jem_teaser</code>)</li><li>Модуль Banner (<code>mod_jem_banner</code>)</li><li>Модуль Jubilee (<code>mod_jem_jubilee</code>)</li><li>Модуль Types (<code>mod_jem_types</code>)</li></ul></div><div class='col-md-6'><h3>Плагины</h3><ul><li>Плагин Content List Events (<code>plg_content_jemlistevents</code>)</li><li>Плагин Embed (<code>plg_content_jemembed</code>)</li><li>Плагин Finder (<code>plg_finder_jem</code>)</li><li>Плагин Comments (<code>plg_jem_comments</code>)</li><li>Плагин Mailer (<code>plg_jem_mailer</code>)</li><li>Плагин Quick Icon (<code>plg_quickicon_jem</code>)</li><li>Плагин Action Log (<code>plg_actionlog_jem</code>)</li></ul></div></div><p>Если вы хотите использовать какие-либо из этих модулей и плагинов, пожалуйста, опубликуйте их в менеджере модулей и менеджере плагинов в панели управления вашего сайта.</p><p>Поддержка сообщества осуществляется на <a href='https://www.joomlaeventmanager.net/forum' target='_blank'>www.joomlaeventmanager.net/forum</a></p><p><a href='https://www.joomlaeventmanager.net/download' target='_blank'>Список изменений</a></p><p>JEM основан на Eventlist Кристофа Лукеса (Christoph Lukes).</p>"
