JEM="JEM"
COM_JEM="JEM"
COM_JEM_INSTALLATION_XML_DESCRIPTION="JEM — компонент управления мероприятиями для Joomla."
COM_JEM_INSTALLATION_DESCRIPTION="<p>JEM — компонент управления мероприятиями для Joomla.</p><p>Это не классический календарь — это удобный способ управления и представления мероприятий для вашей группы, компании или сообщества.<br>JEM предлагает множество возможностей и функций, облегчающих вашу работу, таких как база мест проведения, повторение мероприятий и многое другое.<br>Для посетителей сайта JEM также предоставляет дополнительные возможности: простая система регистрации, ссылки на картографические сервисы, а также подача/редактирование мероприятий и мест проведения из фронтенда …</p><p>Этот пакет состоит из компонента JEM и следующих основных модулей и плагинов:</p><ul><li>Плагин Finder (умный поиск)</li><li>Плагин Mailer</li><li>Плагин комментариев</li><li>Плагин Content List Events</li><li>Плагин Embed</li><li>Плагин Quick Icon</li><li>Плагин Action Log</li><li>Модуль Latest Events Basic</li><li>Модуль Latest Events Wide</li><li>Модуль календаря</li><li>Модуль Teaser</li><li>Модуль Banner</li><li>Модуль Jubilee</li><li>Модуль Venues Map</li><li>Модуль Types</li></ul><p>Если вы хотите использовать какие-либо из этих модулей и плагинов, не забудьте опубликовать их в менеджере модулей и менеджере плагинов в панели управления вашего сайта.</p><p>Поддержка сообщества осуществляется на <a href='https://www.joomlaeventmanager.net/forum' target='_blank'>www.joomlaeventmanager.net/forum</a></p><p><a href='https://www.joomlaeventmanager.net/download' target='_blank'>Список изменений</a></p><p>JEM основан на Eventlist Кристофа Лукеса (Christoph Lukes).</p>"
COM_JEM_INSTALLATION_HEADER="от <a href='https://www.joomlaeventmanager.net' target='_blank'>joomlaeventmanager.net</a><br>Выпущено на условиях <a href='https://www.gnu.org/licenses/gpl-3.0' target='_blank'>GNU General Public License</a>."
