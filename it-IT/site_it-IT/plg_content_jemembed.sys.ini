PLG_CONTENT_JEMEMBED="JEM - Plugin Incorpora"
PLG_CONTENT_JEMEMBED_XML_DESCRIPTION="Il plugin JEM Embed fornisce un'API JSON per recuperare i dati degli eventi dall'estensione JEM."
PLG_CONTENT_JEMEMBED_XML_INSTRUCTION="<h3>JEM Embed</h3><p>Il plugin restituisce gli eventi JEM come JSON, che possono essere utilizzati in vari modi,&nbsp;ad es.&nbsp;per visualizzare gli eventi JEM su qualsiasi sito web esterno (vedi istruzioni qui sotto).</p><p>I parametri di output predefiniti sono definiti nella configurazione del plugin qui. I&nbsp;parametri possono essere integrati e regolati tramite parametri nell'URL di output.</p><p>Esempio:<br /><code class='rl_code'>https://dominio.com/index.php?option=com_ajax&amp;plugin=jemembed&amp;group=content&amp;format=json&amp;token=IL_TUO_TOKEN_DI_SICUREZZA&amp;max=10&amp;venueids=1,2&amp;category=2,3,5</code></p><p><strong>I parametri</strong><br /><code class='rl_code'>type=today|unfinished|upcoming|archived|newest<br />featured=on|off|only<br />title=on|link|off<br />date=on|link|off<br />time=on|off<br />enddatetime=on|off<br />catids=[ID categoria separati da virgola]<br />category=on|link|off<br />venueids=[ID sede separati da virgola]<br />venue=on|link|off<br />max=n<br />cuttitle=n<br />noeventsmsg=[testo del messaggio]</code></p><p>Se utilizzi più di un parametro, vengono combinati con un AND logico. Ciò significa che verranno mostrati solo gli eventi che soddisfano TUTTE le condizioni.</p><p><strong>Token</strong>: Token di sicurezza per prevenire query non autorizzate, da definire nelle impostazioni del plugin.</p><p><strong>Spiegazioni</strong>:</p><p><code>n</code>: un numero positivo<br /><code>|</code>: divide le opzioni tra cui puoi sceglierne una<br /><code>type=today</code>: Eventi di oggi<br /><code>type=unfinished</code>: Eventi imminenti e in corso<br /><code>type=upcoming</code>: Eventi imminenti non ancora iniziati<br /><code>type=archived</code>: Eventi archiviati<br /><code>type=newest</code>: Eventi più recenti (eventi con ID più alti)<br /><code>max</code>: numero massimo di eventi visualizzati<br /><code>cuttitle</code>: lunghezza massima del titolo<br /><code>noeventsmsg</code>: messaggio da visualizzare quando non ci sono eventi</p><p><strong>Come incorporare gli eventi JEM in un sito web esterno:</strong></p><ol><li><strong>Scarica ed estrai i file</strong><br />Scarica il file zip <a href='/media/plg_content_jemembed/files/jemevents.zip'>jemevents.zip</a> ed estrailo. Otterrai i seguenti quattro file:<ul><li><code>jemevents.php</code></li><li><code>jemevents.js</code></li><li><code>jemevents-example.html</code> (pagina di esempio che mostra come funziona l'incorporamento)</li><li><code>readme.txt</code> (istruzioni su come utilizzare i file)</li></ul></li><li><strong>Carica i file sul tuo server web</strong><br />Carica i file <code>jemevents.php</code> e <code>jemevents.js</code> nello spazio web del sito esterno.<br /><em>Nota: Il file <code>jemevents-example.html</code> è opzionale e serve solo come riferimento.</em></li><li><strong>Configura le impostazioni</strong><br />Apri il file <code>jemevents.php</code> e compila la sezione di configurazione secondo le tue esigenze.</li><li><strong>Includi il file JavaScript</strong><br />Nella pagina web in cui desideri visualizzare gli eventi, includi la seguente riga appena prima del tag <code>&lt;/body&gt;</code> di chiusura:<br /><code>&lt;script src='/jemevents.js'&gt;&lt;/script&gt;</code></li><li><strong>Aggiungi il contenitore per gli eventi</strong><br />Nella posizione della pagina in cui dovrebbero apparire gli eventi, aggiungi il seguente elemento HTML:<br /><code>&lt;div id='jemevents-container'&gt;&lt;/div&gt;</code></li></ol>"
