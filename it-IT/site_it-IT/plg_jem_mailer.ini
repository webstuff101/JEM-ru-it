PLG_JEM_MAILER_ADMIN_REG_DESC="Decidere se gli amministratori del sito dovono ricevere una conferma tramite E-mail quando un utente si registra per un evento. È necessario inserire gli indirizzi E-mail, nel campo sotto riportato 'Lista di distribuzione', che desideri ricevere come messaggi di conferma."
PLG_JEM_MAILER_SETTINGS_USER_REG_ONOFF_DESC="Decide se l'utente deve ricevere un'email quando viene aggiunto o rimosso da una lista d'attesa di un evento."
PLG_JEM_MAILER_SETTINGS_ADMIN_REG_ONOFF_DESC="Decidere se gli amministratori del sito dovono ricevere una conferma tramite E-mail quando un utente è attivato o disattivato in un elenco di eventi in attesa. È necessario inserire gli indirizzi E-mail, nel campo sotto riportato 'Lista di distribuzione', che desideri ricevere come messaggi di conferma."
PLG_JEM_MAILER_USER_UNREG_DESC="Decide se l'utente deve ricevere un'email di conferma dopo aver annullato la registrazione a un evento."
PLG_JEM_MAILER_ADMIN_UNREG_DESC="Decide se gli amministratori del sito devono ricevere un'email di conferma quando un utente annulla la registrazione a un evento. Devi inserire gli indirizzi email che desideri ricevano i messaggi di conferma qui nel campo 'Lista di distribuzione' qui sotto."
