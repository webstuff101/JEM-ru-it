PLG_JEM_MAILER_REGISTERED_EDIT_VENUE_DESC="Decide se gli utenti registrati e in lista d'attesa di un evento devono ricevere un'email in caso di modifica della sede associata all'evento."

PLG_JEM_MAILER_CREATOR_LABEL="Creatore"
PLG_JEM_MAILER_NOTIFY_CREATOR_DESC="Abilita l'invio di email al creatore quando un utente diverso modifica l'elemento."
PLG_JEM_MAILER_REGISTRATION_CREATOR_DESC="Abilita l'invio di email al creatore quando i partecipanti cambiano."
PLG_JEM_MAILER_VENUE_EV_CREATOR_LABEL="Creatore evento"
PLG_JEM_MAILER_VENUE_EV_CREATOR_DESC="Abilita l'invio di email al creatore degli eventi quando la sede associata cambia."

PLG_JEM_MAILER_CATEGORY_LABEL="Categoria"
PLG_JEM_MAILER_NOTIFY_CATEGORY_DESC="Abilita l'invio di email agli indirizzi designati nel campo 'email' della categoria quando gli eventi vengono creati o modificati."
PLG_JEM_MAILER_EDIT_VENUE_CATEGORY_DESC="Abilita l'invio di email agli indirizzi designati nel campo 'email' della categoria quando una sede associata a un evento in questa categoria è stata modificata."
PLG_JEM_MAILER_REGISTRATION_CATEGORY_DESC="Abilita l'invio di email agli indirizzi designati nel campo 'email' della categoria quando i partecipanti cambiano."

PLG_JEM_MAILER_CATEGORY_ACL_LABEL="ACL Categoria"
PLG_JEM_MAILER_NOTIFY_CATEGORY_ACL_DESC="Abilita l'invio di email agli indirizzi designati nel campo 'email' dell'ACL della categoria quando gli eventi vengono creati o modificati."
PLG_JEM_MAILER_GROUP_LABEL="Gruppo"
PLG_JEM_MAILER_NEW_EVENT_GROUP="Decide se il gruppo utenti della categoria dell'evento riceve email quando viene creato un nuovo evento in questa categoria."
PLG_JEM_MAILER_EDIT_EVENT_GROUP="Decide se il gruppo utenti della categoria dell'evento riceve email quando un evento cambia in questa categoria."
PLG_JEM_MAILER_EDIT_VENUE_GROUP="Decide se il gruppo utenti della categoria di tutti gli eventi in una sede riceve email quando la sede cambia."
PLG_JEM_MAILER_REGISTRATION_GROUP_DESC="Decide se il gruppo utenti della categoria dell'evento riceve email quando i partecipanti cambiano."

PLG_JEM_MAILER_VENUE_NOTIFICATIONS="Notifiche sede"
PLG_JEM_MAILER_NEW_VENUE_TITLE="<b>E-mail inserimento nuova sede</b>"
PLG_JEM_MAILER_EDIT_VENUE_TITLE="<b>E-mail aggiornamento sede</b>"
PLG_JEM_MAILER_USER_NEW_VENUE_DESC="Decidere se l'utente deve ricevere una E-mail di conferma all'inserimento di una propria sede."
PLG_JEM_MAILER_ADMIN_NEW_VENUE_DESC="Decidere se l'admin deve ricevere una E-mail di conferma all'invio di una nuova sede da parte di un utente."
PLG_JEM_MAILER_USER_EDIT_VENUE_DESC="Decidere se l'utente deve ricevere una E-mail di conferma alla modifica di una propria sede."
PLG_JEM_MAILER_ADMIN_EDIT_VENUE_DESC="Decidere se l'admin deve ricevere una E-mail di conferma alla modifica di una sede da parte di un utente."

PLG_JEM_MAILER_ADMIN_OPTIONS="Amministratori"
PLG_JEM_MAILER_ALL_ADMINS_DESC="Decidere se gli utenti abilitati che sono autorizzati a ricevere e-E-mail di sistema dovrebbero ricevere E-mail di conferma di admin."
PLG_JEM_MAILER_ADMIN_MAIL_RECEIVERS="Lista di distribuzione"
PLG_JEM_MAILER_ADMIN_MAIL_RECEIVERS_DESC="Gli indirizzi email delle persone che dovrebbero ricevere le email di conferma dell'amministratore. Devono essere separati da virgole. Questa lista funziona indipendentemente dall'opzione sopra, ma funziona bene anche insieme ad essa."

