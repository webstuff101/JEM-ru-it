MOD_JEM_WIDE_OFFSET_HOURS="Tempo offset (in ore)"
MOD_JEM_WIDE_OFFSET_HOURS_DESC="Sposta il tempo nel futuro (valori positivi) o nel passato (valori negativi). Utilizzato solo per visualizzare eventi non archiviati; per gli eventi odierni viene arrotondato ai giorni interi. <br>Esempi: per mostrare eventi terminati almeno due ore fa, imposta il tipo su Eventi non terminati e l'offset su -2. Per mostrare eventi che iniziano tra una settimana o più, imposta il tipo su Prossimi eventi e l'offset su 168 (7 * 24). Per mostrare gli eventi di domani, imposta il tipo su Oggi e l'offset su 24."
