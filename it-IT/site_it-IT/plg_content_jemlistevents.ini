PLG_CONTENT_JEMLISTEVENTS_TYPE_LABEL="Tipo di eventi"
PLG_CONTENT_JEMLISTEVENTS_TYPE_DESCRIPTION="Specifica quali eventi visualizzare: <strong>today</strong>: eventi che si svolgono oggi. <strong>unfinished</strong>: eventi prossimi e in corso. <strong>ongoing</strong>: eventi in corso, che si svolgono ora. <strong>upcoming</strong>: eventi futuri non ancora iniziati. <strong>archived</strong>: eventi passati. <strong>newest</strong>: eventi aggiunti di recente (in base agli ID più alti). <strong>open</strong>: eventi aperti senza data/ora. <strong>all</strong>: tutti gli eventi (passati, in corso, futuri e archiviati)."
