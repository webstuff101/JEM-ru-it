PLG_CONTENT_JEMLISTEVENTS="JEM - Plugin elenco eventi"
PLG_CONTENT_JEMLISTEVENTS_XML_DESCRIPTION="Plugin per visualizzare gli eventi JEM all'interno dei contenuti Joomla"
PLG_CONTENT_JEMLISTEVENTS_XML_INSTRUCTION="<div class='jem-documentation'><p class='jem-intro'>Il plugin <strong>JEM List Events</strong> ti permette di integrare senza problemi gli eventi JEM nei tuoi articoli Joomla o moduli personalizzati. Usa il tag <code>{jemlistevents}</code> con parametri opzionali per personalizzare la visualizzazione degli eventi.</p><h2 class='jem-section-title'>Come si usa</h2><p class='jem-instruction'>Aggiungi il seguente tag al tuo contenuto:</p><div class='jem-code'><code>{jemlistevents}</code></div><p class='jem-instruction'>Imposta i parametri predefiniti nelle impostazioni del plugin.<br>Per personalizzare l'output del tag puoi modificare i parametri predefiniti nel tag. Ecco la sintassi completa:</p><div class='jem-code'><code>{jemlistevents [type=today|unfinished|ongoing|upcoming|archived|newest|open|all]; [featured=on|off|only]; [title=on|link|off]; [date=on|link|off]; [time=on|off]; [enddatetime=on|off]; [eventids=n]; [catids=n]; [category=on|link|off]; [venueids=n]; [venue=on|link|off]; [max=n]; [cuttitle=n]; [noeventsmsg=msg]}</code></div><p class='jem-note'><strong>Nota:</strong> sostituisci <code>n</code> con un numero positivo, e usa <code>|</code> per separare le opzioni (scegline una), vedi l'esempio sotto.</p><h2 class='jem-section-title'>Dettagli dei parametri</h2><div class='jem-parameters'><ul class='jem-parameter-list'><li class='jem-parameter'><strong>type</strong>: specifica quali eventi visualizzare.<ul class='jem-sub-parameters'><li><code>today</code>: eventi che si svolgono oggi.</li><li><code>unfinished</code>: eventi prossimi e in corso.</li><li><code>ongoing</code>: eventi in corso, che si svolgono ora.</li><li><code>upcoming</code>: eventi futuri non ancora iniziati.</li><li><code>archived</code>: eventi archiviati.</li><li><code>newest</code>: eventi aggiunti di recente (in base agli ID più alti).</li><li><code>open</code>: eventi aperti senza data/ora</li><li><code>all</code>: tutti gli eventi (passati, in corso, futuri e archiviati)</li></ul></li><li class='jem-parameter'><strong>featured</strong>: include gli eventi in primo piano.<ul class='jem-sub-parameters'><li><code>on</code>: mostra eventi in primo piano e non.</li><li><code>off</code>: mostra solo eventi non in primo piano (nasconde quelli in primo piano).</li><li><code>only</code>: mostra solo gli eventi in primo piano.</li></ul></li><li class='jem-parameter'><strong>title</strong>: visualizza i titoli degli eventi.<ul class='jem-sub-parameters'><li><code>on</code>: mostra i titoli.</li><li><code>link</code>: mostra i titoli come link.</li><li><code>off</code>: nasconde i titoli.</li></ul></li><li class='jem-parameter'><strong>date</strong>: visualizza le date degli eventi.<ul class='jem-sub-parameters'><li><code>on</code>: mostra le date.</li><li><code>link</code>: mostra le date come link.</li><li><code>off</code>: nasconde le date.</li></ul></li><li class='jem-parameter'><strong>time</strong>: visualizza gli orari degli eventi.<ul class='jem-sub-parameters'><li><code>on</code>: mostra gli orari.</li><li><code>off</code>: nasconde gli orari.</li></ul></li><li class='jem-parameter'><strong>enddatetime</strong>: visualizza le date/orari di fine evento.<ul class='jem-sub-parameters'><li><code>on</code>: mostra le date/orari di fine.</li><li><code>off</code>: nasconde le date/orari di fine.</li></ul></li><li class='jem-parameter'><strong>eventids</strong>: filtra gli eventi per ID evento (es. <code>eventids=3,10,12</code>).</li><li class='jem-parameter'><strong>catids</strong>: filtra gli eventi per ID categoria (es. <code>catids=2,14</code>).</li><li class='jem-parameter'><strong>category</strong>: visualizza le categorie degli eventi.<ul class='jem-sub-parameters'><li><code>on</code>: mostra le categorie.</li><li><code>link</code>: mostra le categorie come link.</li><li><code>off</code>: nasconde le categorie.</li></ul></li><li class='jem-parameter'><strong>venueids</strong>: filtra gli eventi per ID sede (es. <code>venueids=2,4</code>).</li><li class='jem-parameter'><strong>venue</strong>: visualizza le sedi degli eventi.<ul class='jem-sub-parameters'><li><code>on</code>: mostra le sedi.</li><li><code>link</code>: mostra le sedi come link.</li><li><code>off</code>: nasconde le sedi.</li></ul></li><li class='jem-parameter'><strong>max</strong>: limita il numero di eventi visualizzati (es. <code>max=5</code>).</li><li class='jem-parameter'><strong>cuttitle</strong>: limita la lunghezza dei titoli degli eventi (es. <code>cuttitle=25</code>).</li><li class='jem-parameter'><strong>noeventsmsg</strong>: messaggio personalizzato da visualizzare quando non vengono trovati eventi (es. <code>noeventsmsg='Nessun evento trovato'</code>).</li></ul></div><h2 class='jem-section-title'>Esempio</h2><p class='jem-instruction'>Per visualizzare fino a 5 eventi futuri delle categorie 2 e 14, usa:</p><div class='jem-code'><code>{jemlistevents type=upcoming; catids=2,14; max=5; noeventsmsg='Nessun evento trovato'}</code></div><br><h2 class='jem-section-title'>Formattazione di data e ora</h2><p class='jem-instruction'>Per una formattazione avanzata di data e ora, consulta la <a class='jem-link' href='https://www.php.net/manual/datetime.format.php' target='_blank'>documentazione PHP DateTime</a>.</p><p class='jem-outro'>Buon utilizzo del plugin JEM List Events per arricchire i tuoi contenuti Joomla!</p></div>"
