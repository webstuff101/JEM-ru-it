PKG_JEM="JEM - Pacchetto"
PKG_JEM_INSTALLATION_DESCRIPTION="<p>JEM è un componente di gestione eventi per Joomla.</p><p>Non è un classico calendario - è un modo semplice per gestire e presentare gli eventi per il tuo gruppo, azienda o comunità.<br>JEM offre molte funzionalità e possibilità, tra cui la gestione delle sedi, la ricorrenza degli eventi, la registrazione, i link ai servizi di mappe, l'invio di eventi e sedi dal frontend, e molto altro.</p><p>Questo pacchetto installa il componente JEM (<code>com_jem</code>) insieme a questi moduli e plugin:</p><div class='row'><div class='col-md-6'><h3>Moduli</h3><ul><li>Modulo Ultimi Eventi Basic (<code>mod_jem</code>)</li><li>Modulo Ultimi Eventi Wide (<code>mod_jem_wide</code>)</li><li>Modulo Calendario (<code>mod_jem_cal</code>)</li><li>Modulo Mappa Sedi (<code>mod_jem_map</code>)</li><li>Modulo Teaser (<code>mod_jem_teaser</code>)</li><li>Modulo Banner (<code>mod_jem_banner</code>)</li><li>Modulo Jubilee (<code>mod_jem_jubilee</code>)</li><li>Modulo Tipi (<code>mod_jem_types</code>)</li></ul></div><div class='col-md-6'><h3>Plugin</h3><ul><li>Plugin Content List Events (<code>plg_content_jemlistevents</code>)</li><li>Plugin Embed (<code>plg_content_jemembed</code>)</li><li>Plugin Finder (<code>plg_finder_jem</code>)</li><li>Plugin Commenti (<code>plg_jem_comments</code>)</li><li>Plugin Mailer (<code>plg_jem_mailer</code>)</li><li>Plugin Quick Icon (<code>plg_quickicon_jem</code>)</li><li>Plugin Action Log (<code>plg_actionlog_jem</code>)</li></ul></div></div><p>Se desideri utilizzare uno di questi moduli e plugin, non dimenticare di pubblicarli nel gestore dei moduli e nel gestore dei plugin nel backend del tuo sito.</p><p>Il supporto della comunità è disponibile su <a href='https://www.joomlaeventmanager.net/forum' target='_blank'>www.joomlaeventmanager.net/forum</a></p><p><a href='https://www.joomlaeventmanager.net/download' target='_blank'>Registro delle modifiche</a></p><p>JEM è basato su Eventlist di Christoph Lukes.</p>"
