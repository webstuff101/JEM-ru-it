; Backend SYS file

JEM="JEM"
COM_JEM="JEM"
COM_JEM_INSTALLATION_XML_DESCRIPTION="JEM è un componente di gestione eventi per Joomla."
COM_JEM_INSTALLATION_DESCRIPTION="<p>JEM è un componente di gestione eventi per Joomla.</p><p>Non è un classico calendario – è un modo semplice per gestire e presentare i tuoi eventi per il tuo gruppo, azienda o comunità.<br>JEM offre molte funzionalità e possibilità che rendono il tuo lavoro più facile, come il database delle Sedi, la ricorrenza degli eventi e molto altro.<br>Ma anche per i visitatori del tuo sito, JEM ha alcune funzionalità aggiuntive da offrire, come un semplice sistema di registrazione, link a servizi di mappe, o l'invio/modifica di eventi e sedi dal frontend …</p><p>Questo pacchetto è composto dal componente JEM combinato con i seguenti moduli e plugin essenziali:</p><ul><li>Plugin Finder (ricerca intelligente)</li><li>Plugin Mailer</li><li>Plugin Commenti</li><li>Plugin Content List Events</li><li>Plugin Embed</li><li>Plugin Quick Icon</li><li>Plugin Action Log</li><li>Modulo Ultimi Eventi Basic</li><li>Modulo Ultimi Eventi Wide</li><li>Modulo Calendario</li><li>Modulo Teaser</li><li>Modulo Banner</li><li>Modulo Jubilee</li><li>Modulo Mappa Sedi</li><li>Modulo Tipi</li></ul><p>Se desideri utilizzare uno di questi moduli e plugin, non dimenticare di pubblicarli nel gestore dei moduli e nel gestore dei plugin nel backend del tuo sito.</p><p>Il supporto della comunità è disponibile su <a href='https://www.joomlaeventmanager.net/forum' target='_blank'>www.joomlaeventmanager.net/forum</a></p><p><a href='https://www.joomlaeventmanager.net/download' target='_blank'>Registro delle modifiche</a></p><p>JEM è basato su Eventlist di Christoph Lukes.</p>"
COM_JEM_INSTALLATION_HEADER="di <a href='https://www.joomlaeventmanager.net' target='_blank'>joomlaeventmanager.net</a><br>Rilasciato secondo i termini e le condizioni della <a href='https://www.gnu.org/licenses/gpl-3.0' target='_blank'>GNU General Public License</a>."

